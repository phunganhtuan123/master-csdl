# =====================================================================
# docker compose up -d   -> PostgreSQL 16 + pgvector, API, Web
#   Web (khách + admin) : http://localhost:3000     (admin: /admin, tài khoản admin / admin123)
#   API                 : http://localhost:4000/api/health
#   Monitor/benchmark   : http://localhost:3000/admin/monitor  (trong trang quản trị)
#   PostgreSQL          : localhost:5432  (postgres / postgres, db jewelry)
# =====================================================================
services:
  db:
    image: pgvector/pgvector:pg16          # PostgreSQL 16 có sẵn extension vector
    container_name: jewelry-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jewelry
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
               -c pg_stat_statements.track=all
               -c log_min_duration_statement=200
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jewelry"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: jewelry-api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/jewelry
      PORT: 4000
      JWT_SECRET: doi-secret-nay-khi-deploy
      ADMIN_PASSWORD: admin123
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
    # Lần đầu: chạy migration + seed + embedding rồi mới start server
    command: sh -c "npm run migrate && npm run seed && npm run embed && npm start"

  web:
    build: ./web
    container_name: jewelry-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_INTERNAL_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
